<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infinity Role Play Admin Panel</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 15px;color:#fff;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#073e82,#020817 58%)}h1{text-align:center;color:#55d7ff;text-shadow:0 0 18px #00aaff}.card{max-width:650px;margin:18px auto;padding:22px;border:1px solid #168ee8;border-radius:24px;background:#06172eef;box-shadow:0 0 24px #008cff33}input,textarea,button{width:100%;margin:8px 0;padding:14px;border-radius:14px;font-size:16px}input,textarea{color:#fff;background:#041125;border:1px solid #228ed0}textarea{min-height:120px;resize:vertical}button{border:0;color:#001329;font-weight:bold;background:linear-gradient(90deg,#0d8fff,#18dcff)}.danger{background:linear-gradient(90deg,#ff4664,#ff8a3d)}.hide{display:none}.msg{min-height:24px;color:#63dcff;white-space:pre-wrap}.switch{display:flex;align-items:center;gap:10px;margin:12px 0}.switch input{width:24px;height:24px}</style></head>
<body><h1>INFINITY ROLE PLAY<br>ADMIN PANEL</h1>
<section id="login" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><div id="loginMsg" class="msg"></div></section>
<main id="panel" class="hide">
<section class="card"><h2>📰 INFINITY ROLE PLAY NEWS</h2><input id="newsTitle" placeholder="News title"><input id="newsAuthor" value="INFINITY ROLE PLAY TEAM" placeholder="Author"><input id="newsDate" type="date"><textarea id="newsBody" placeholder="News message / details"></textarea><input id="newsImageFile" type="file" accept="image/*"><input id="newsImageUrl" type="url" placeholder="Image URL (auto after upload or paste direct URL)"><button onclick="uploadAndSaveNews()">UPLOAD / SAVE NEWS</button><button onclick="loadNews()">LOAD CURRENT NEWS</button><button class="danger" onclick="deleteNews()">DELETE NEWS</button><div id="newsStatus" class="msg"></div></section>
<section class="card"><h2>⬆️ Forced App Update</h2><label class="switch"><input id="updateEnabled" type="checkbox"><b>Force Update ON</b></label><input id="updateTitle" value="NEW UPDATE AVAILABLE" placeholder="Update popup title"><textarea id="updateText" placeholder="Update details / message"></textarea><input id="updateApk" type="file" accept=".apk,application/vnd.android.package-archive"><input id="updateUrl" type="url" placeholder="APK download URL (auto after upload)"><button onclick="uploadAndSaveUpdate()">UPLOAD APK & SAVE UPDATE</button><button onclick="saveUpdateSettings()">SAVE TEXT / ON-OFF</button><button class="danger" onclick="disableUpdate()">TURN FORCED UPDATE OFF</button><div id="updateStatus" class="msg"></div></section>
<section class="card"><h2>🖼️ Home Popup Banner</h2><label class="switch"><input id="popupEnabled" type="checkbox" checked><b>Popup ON</b></label><input id="popupTitle" placeholder="Popup title" value="INFINITY ROLE PLAY"><input id="popupImage" type="url" placeholder="Banner image direct link (https://...jpg)"><textarea id="popupText" placeholder="Popup message"></textarea><button onclick="savePopup()">SAVE POPUP BANNER</button><button class="danger" onclick="disablePopup()">TURN POPUP OFF</button><div id="popupStatus" class="msg"></div></section>
<section class="card"><h2>📣 Send App Notification</h2><p>App එක විවෘත කර Home එකට පැමිණෙන users ලගේ phone notification එකට පෙන්වයි.</p><input id="title" value="INFINITY ROLE PLAY ANNOUNCEMENT" placeholder="Notification title"><textarea id="body" placeholder="Type your message here..."></textarea><button onclick="sendNotification()">SEND NOTIFICATION</button><div id="status" class="msg"></div></section>
<section class="card"><button onclick="logout()">LOGOUT</button></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script>
async function loadNews(){newsStatus.textContent='Loading...';try{const s=await db.ref('appNews').once('value'),n=s.val()||{};newsTitle.value=n.title||'';newsAuthor.value=n.author||'INFINITY ROLE PLAY TEAM';newsDate.value=n.date||'';newsBody.value=n.body||'';newsImageUrl.value=n.imageUrl||'';newsStatus.textContent=n.title?'✅ Current news loaded.':'No news published yet.'}catch(e){newsStatus.textContent='❌ '+e.message}}
async function saveNews(imageUrl){const t=newsTitle.value.trim(),b=newsBody.value.trim();if(!t||!b){newsStatus.textContent='❌ News title සහ message දෙකම ඇතුළත් කරන්න.';return}await db.ref('appNews').set({title:t,author:newsAuthor.value.trim()||'INFINITY ROLE PLAY TEAM',date:newsDate.value||new Date().toISOString().slice(0,10),body:b,imageUrl:(imageUrl||newsImageUrl.value).trim(),updatedAt:Date.now()});newsStatus.textContent='✅ News published successfully.'}
async function uploadAndSaveNews(){const f=newsImageFile.files[0];newsStatus.textContent='Saving news...';try{if(!f){await saveNews(newsImageUrl.value);return}const ref=storage.ref('news-images/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_')),task=ref.put(f);task.on('state_changed',s=>newsStatus.textContent='Uploading image... '+Math.round(s.bytesTransferred/s.totalBytes*100)+'%',e=>newsStatus.textContent='❌ '+e.message,async()=>{const url=await task.snapshot.ref.getDownloadURL();newsImageUrl.value=url;await saveNews(url)})}catch(e){newsStatus.textContent='❌ '+e.message}}
async function deleteNews(){if(!confirm('Current news delete කරන්නද?'))return;try{await db.ref('appNews').remove();newsTitle.value='';newsBody.value='';newsImageUrl.value='';newsStatus.textContent='✅ News deleted.'}catch(e){newsStatus.textContent='❌ '+e.message}}
</script>
<script>const firebaseConfig={apiKey:"AIzaSyDWxZPjXFtLPP4GfueoLdohMhGjvrD_z2c",authDomain:"infinityroleplay.firebaseapp.com",databaseURL:"https://infinityroleplay-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"infinityroleplay",storageBucket:"infinityroleplay.firebasestorage.app",messagingSenderId:"262561203529",appId:"1:262561203529:web:36ebab6e99f9d1703c8698"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database(),storage=firebase.storage(),loginBox=document.getElementById('login'),panel=document.getElementById('panel');auth.onAuthStateChanged(async u=>{loginBox.classList.toggle('hide',!!u);panel.classList.toggle('hide',!u);if(u){loadPopup();loadUpdate()}});async function login(){try{loginMsg.textContent='';await auth.signInWithEmailAndPassword(email.value,password.value)}catch(e){loginMsg.textContent=e.message}}function logout(){auth.signOut()}async function loadUpdate(){try{const s=await db.ref('appUpdate').once('value'),u=s.val()||{};updateEnabled.checked=u.enabled===true;updateTitle.value=u.title||'NEW UPDATE AVAILABLE';updateText.value=u.text||'';updateUrl.value=u.apkUrl||''}catch(e){updateStatus.textContent='❌ '+e.message}}async function saveUpdateSettings(){const url=updateUrl.value.trim();if(updateEnabled.checked&&!url){updateStatus.textContent='❌ APK upload කරන්න හෝ download URL එකක් දාන්න.';return}updateStatus.textContent='Saving...';try{await db.ref('appUpdate').set({enabled:updateEnabled.checked,title:updateTitle.value.trim()||'NEW UPDATE AVAILABLE',text:updateText.value.trim(),apkUrl:url,updatedAt:Date.now()});updateStatus.textContent='✅ Update popup settings saved.'}catch(e){updateStatus.textContent='❌ '+e.message}}async function uploadAndSaveUpdate(){const f=updateApk.files[0];if(!f){updateStatus.textContent='❌ APK file එක තෝරන්න.';return}updateStatus.textContent='Uploading APK... 0%';try{const ref=storage.ref('app-updates/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_')),task=ref.put(f);task.on('state_changed',s=>updateStatus.textContent='Uploading APK... '+Math.round(s.bytesTransferred/s.totalBytes*100)+'%',e=>updateStatus.textContent='❌ '+e.message,async()=>{updateUrl.value=await task.snapshot.ref.getDownloadURL();updateEnabled.checked=true;await saveUpdateSettings()})}catch(e){updateStatus.textContent='❌ '+e.message}}async function disableUpdate(){try{await db.ref('appUpdate/enabled').set(false);updateEnabled.checked=false;updateStatus.textContent='✅ Forced update turned off.'}catch(e){updateStatus.textContent='❌ '+e.message}}async function loadPopup(){try{const s=await db.ref('appPopup').once('value'),p=s.val()||{};popupEnabled.checked=p.enabled!==false;popupTitle.value=p.title||'INFINITY ROLE PLAY';popupImage.value=p.imageUrl||'';popupText.value=p.text||''}catch(e){popupStatus.textContent='❌ '+e.message}}async function savePopup(){popupStatus.textContent='Saving...';try{await db.ref('appPopup').set({enabled:popupEnabled.checked,title:popupTitle.value.trim(),imageUrl:popupImage.value.trim(),text:popupText.value.trim(),updatedAt:Date.now()});popupStatus.textContent='✅ Popup banner saved successfully.'}catch(e){popupStatus.textContent='❌ '+e.message}}async function disablePopup(){try{await db.ref('appPopup/enabled').set(false);popupEnabled.checked=false;popupStatus.textContent='✅ Popup turned off.'}catch(e){popupStatus.textContent='❌ '+e.message}}async function sendNotification(){const t=title.value.trim(),b=body.value.trim();if(!t||!b){status.textContent='Title සහ message දෙකම ඇතුළත් කරන්න.';return}status.textContent='Sending...';try{await db.ref('appNotification').set({id:String(Date.now()),title:t,body:b,date:new Date().toISOString(),author:auth.currentUser.email});status.textContent='✅ Notification sent successfully.';body.value=''}catch(e){status.textContent='❌ '+e.message}}</script></body></html>
